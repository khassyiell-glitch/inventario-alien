<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inventário ALIEN</title>
<style>
:root{--bg:#050b0c;--pn:#0c1718;--ln:#2b5a58;--tx:#cfe3df;--mu:#7fa5a0;--ac:#5fe0d0;--in:#d9e6e2;--it:#0a1213;--wr:#e0a85f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 "Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;height:100vh}
header{padding:10px 14px;border-bottom:1px solid var(--ln);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:17px;margin:0;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);font-weight:600;margin-right:6px}
select,input{background:var(--it);border:1px solid var(--ln);color:var(--in);border-radius:6px;padding:6px 8px;font:inherit;min-width:0;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
#char{width:auto;flex:1;min-width:140px;max-width:260px}
.cap{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mu);letter-spacing:.08em;text-transform:uppercase}
.cap input{width:72px}
#tot{display:flex;gap:12px;margin-left:auto;font-size:12px;color:var(--mu)}
#tot b{color:var(--ac)}#tot .over,#tot .over b{color:var(--wr)}
#add{margin:10px 14px 0;padding:9px 12px;border:1px dashed var(--ac);border-radius:8px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:13px}
#add[hidden]{display:none}
#add button{background:var(--ac);color:#04201c;border:0;border-radius:6px;padding:7px 12px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
main{flex:1;overflow:auto;padding:12px 14px}
.it{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.top{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.th{width:40px;height:40px;flex:none;border:1px solid var(--ln);border-radius:6px;background:var(--it);overflow:hidden}
.th img{width:100%;height:100%;object-fit:contain}
.q{display:flex;align-items:center;gap:4px;flex:none}
.q b{min-width:24px;text-align:center;color:var(--ac);font-size:16px}
.q button,.x{width:30px;height:30px;flex:none;border-radius:6px;border:1px solid var(--ln);background:var(--it);color:var(--ac);cursor:pointer;font-size:15px}
.x{width:auto;min-width:30px;padding:0 6px;color:var(--mu);font-size:13px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:8px}
.g label{font-size:11px;color:var(--mu);letter-spacing:.08em;text-transform:uppercase}
.g input,.g select{margin-top:3px;text-transform:none;letter-spacing:0}
.warn{margin:0 0 8px;font-size:12px;color:var(--wr)}
.mute{color:var(--mu);text-align:center;padding:30px 10px}
</style></head>
<body>
<header><h1>Inventário</h1><select id="char" aria-label="Personagem"></select>
<label class="cap">Carga máx.<input id="cap" type="number" min="0" step="0.5"></label><div id="tot"></div></header>
<div id="add" hidden></div>
<main id="list"></main>
<script src="app.js"></script>
</body></html>
